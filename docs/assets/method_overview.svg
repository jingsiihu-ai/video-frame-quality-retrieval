<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Video frame quality and multimodal retrieval architecture</title>
  <desc id="desc">A technical diagram showing bounded frame sampling, visual quality analysis, visual/OCR/ASR embedding fusion, two-stage temporal anomaly scoring, candidate utility calculation, and diversity-aware maximal marginal relevance selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0284C7"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DB2777"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.subtitle{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .h{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.label{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}.eq{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#312E81}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;rx:20;filter:url(#shadow)}.soft{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.2;rx:12}
      .arrow{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="840" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Video Frame Quality &amp; Multimodal Retrieval</text>
  <text x="60" y="92" class="subtitle">A bounded, inspectable ranking pipeline for selecting relevant, high-quality and temporally diverse frames</text>
  <g transform="translate(1110,36)"><rect width="230" height="40" rx="20" fill="#DBEAFE"/><text x="115" y="25" text-anchor="middle" class="label" fill="#1D4ED8">retrieval · ranking · VLM input</text></g>

  <!-- Timeline -->
  <g transform="translate(45,130)">
    <rect class="card" width="1310" height="205"/>
    <circle cx="31" cy="34" r="17" fill="#DBEAFE"/><text x="31" y="40" text-anchor="middle" class="label" fill="#1D4ED8">1</text>
    <text x="62" y="40" class="h">Bounded sampling over the video timeline</text>
    <text x="1020" y="40" class="small">deterministic budget: N frames → M candidates</text>
    <g transform="translate(30,66)">
      <path d="M16 118H1230" stroke="#94A3B8" stroke-width="2"/>
      <g>
        <g transform="translate(0,0)"><rect width="132" height="92" rx="10" fill="#BAE6FD" stroke="#38BDF8"/><circle cx="33" cy="38" r="18" fill="#FDE68A"/><path d="M12 77Q65 45 120 76" fill="#22C55E"/><text x="66" y="110" text-anchor="middle" class="small">t₀</text></g>
        <g transform="translate(154,0)"><rect width="132" height="92" rx="10" fill="#BAE6FD" stroke="#38BDF8"/><circle cx="44" cy="34" r="18" fill="#FDE68A"/><path d="M12 77Q65 48 120 70" fill="#22C55E"/><text x="66" y="110" text-anchor="middle" class="small">t₁</text></g>
        <g transform="translate(308,0)"><rect width="132" height="92" rx="10" fill="#CBD5E1" stroke="#64748B"/><path d="M10 80L42 21L78 78L100 35L125 80" fill="#475569"/><path d="M20 15L116 85M13 55L83 8" stroke="#F8FAFC" stroke-width="5" opacity=".8"/><text x="66" y="110" text-anchor="middle" class="small">t₂ · degraded</text></g>
        <g transform="translate(462,0)"><rect width="132" height="92" rx="10" fill="#FED7AA" stroke="#FB923C"/><rect x="19" y="19" width="94" height="54" rx="9" fill="#F97316"/><text x="66" y="50" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="700" fill="white">TITLE CARD</text><text x="66" y="110" text-anchor="middle" class="small">t₃ · scene cut</text></g>
        <g transform="translate(616,0)"><rect width="132" height="92" rx="10" fill="#DDD6FE" stroke="#8B5CF6"/><rect x="15" y="57" width="102" height="20" rx="6" fill="#7C3AED"/><text x="66" y="71" text-anchor="middle" font-family="Inter,Arial" font-size="10" fill="white">OCR overlay</text><circle cx="66" cy="31" r="20" fill="#C4B5FD"/><text x="66" y="110" text-anchor="middle" class="small">t₄</text></g>
        <g transform="translate(770,0)"><rect width="132" height="92" rx="10" fill="#DDD6FE" stroke="#8B5CF6"/><circle cx="66" cy="34" r="22" fill="#A78BFA"/><path d="M33 75Q65 51 100 75" fill="#7C3AED"/><text x="66" y="110" text-anchor="middle" class="small">t₅</text></g>
        <g transform="translate(924,0)"><rect width="132" height="92" rx="10" fill="#DCFCE7" stroke="#22C55E"/><path d="M16 74Q60 25 116 68" fill="none" stroke="#16A34A" stroke-width="9"/><circle cx="92" cy="30" r="13" fill="#FDE68A"/><text x="66" y="110" text-anchor="middle" class="small">t₆</text></g>
        <g transform="translate(1078,0)"><rect width="132" height="92" rx="10" fill="#DCFCE7" stroke="#22C55E"/><path d="M16 72Q62 29 116 65" fill="none" stroke="#16A34A" stroke-width="9"/><circle cx="82" cy="27" r="13" fill="#FDE68A"/><text x="66" y="110" text-anchor="middle" class="small">t₇</text></g>
      </g>
      <g fill="#2563EB"><circle cx="66" cy="118" r="5"/><circle cx="220" cy="118" r="5"/><circle cx="374" cy="118" r="5"/><circle cx="528" cy="118" r="5"/><circle cx="682" cy="118" r="5"/><circle cx="836" cy="118" r="5"/><circle cx="990" cy="118" r="5"/><circle cx="1144" cy="118" r="5"/></g>
    </g>
  </g>

  <!-- Feature branches -->
  <g transform="translate(45,380)">
    <rect class="card" width="330" height="315"/>
    <circle cx="31" cy="34" r="17" fill="#DCFCE7"/><text x="31" y="40" text-anchor="middle" class="label" fill="#15803D">2A</text>
    <text x="62" y="40" class="h">Inspectable frame quality</text>
    <g transform="translate(24,72)">
      <g><rect width="282" height="58" class="soft"/><text x="18" y="25" class="label">brightness</text><rect x="122" y="18" width="140" height="12" rx="6" fill="#E2E8F0"/><rect x="122" y="18" width="98" height="12" rx="6" fill="#F59E0B"/><text x="18" y="47" class="small">exposure validity</text></g>
      <g transform="translate(0,75)"><rect width="282" height="58" class="soft"/><text x="18" y="25" class="label">contrast</text><rect x="122" y="18" width="140" height="12" rx="6" fill="#E2E8F0"/><rect x="122" y="18" width="112" height="12" rx="6" fill="#22C55E"/><text x="18" y="47" class="small">percentile spread</text></g>
      <g transform="translate(0,150)"><rect width="282" height="58" class="soft"/><text x="18" y="25" class="label">sharpness</text><rect x="122" y="18" width="140" height="12" rx="6" fill="#E2E8F0"/><rect x="122" y="18" width="73" height="12" rx="6" fill="#2563EB"/><text x="18" y="47" class="small">Laplacian energy</text></g>
      <g transform="translate(0,225)"><rect width="282" height="42" rx="12" fill="#F0FDF4" stroke="#86EFAC"/><text x="141" y="27" text-anchor="middle" class="eq">qᵢ = normalize([bᵢ,cᵢ,sᵢ])</text></g>
    </g>
  </g>

  <g transform="translate(415,380)">
    <rect class="card" width="330" height="315"/>
    <circle cx="31" cy="34" r="17" fill="#EDE9FE"/><text x="31" y="40" text-anchor="middle" class="label" fill="#6D28D9">2B</text>
    <text x="62" y="40" class="h">Multimodal evidence</text>
    <g transform="translate(24,72)">
      <g><rect width="88" height="66" rx="12" fill="#DBEAFE" stroke="#93C5FD"/><circle cx="28" cy="28" r="13" fill="#FDE68A"/><path d="M10 55Q43 29 78 55" fill="#22C55E"/><text x="44" y="61" text-anchor="middle" class="small">visual</text></g>
      <g transform="translate(97,0)"><rect width="88" height="66" rx="12" fill="#FCE7F3" stroke="#F9A8D4"/><text x="44" y="27" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#BE185D">OCR</text><path d="M15 42H73M22 51H66" stroke="#DB2777" stroke-width="3"/><text x="44" y="61" text-anchor="middle" class="small">text</text></g>
      <g transform="translate(194,0)"><rect width="88" height="66" rx="12" fill="#FEF3C7" stroke="#FCD34D"/><path d="M15 35Q24 14 33 35T51 35T69 35" fill="none" stroke="#D97706" stroke-width="3"/><text x="44" y="61" text-anchor="middle" class="small">ASR</text></g>
      <path class="arrow" d="M44 78C44 113 109 113 133 135"/><path class="arrow" d="M141 78V131"/><path class="arrow" d="M238 78C238 113 174 113 150 135"/>
      <rect x="52" y="139" width="178" height="63" rx="14" fill="url(#pink)"/><text x="141" y="165" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="white">normalized fusion</text><text x="141" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#FCE7F3">vᵢ = Σₘ wₘ eᵢᵐ</text>
      <rect x="52" y="225" width="178" height="42" class="soft"/><text x="141" y="251" text-anchor="middle" class="eq">rᵢ = (cos(vᵢ,q)+1)/2</text>
    </g>
  </g>

  <g transform="translate(785,380)">
    <rect class="card" width="290" height="315"/>
    <circle cx="31" cy="34" r="17" fill="#FFEDD5"/><text x="31" y="40" text-anchor="middle" class="label" fill="#C2410C">3</text>
    <text x="62" y="40" class="h">Two-stage temporal signal</text>
    <g transform="translate(22,75)">
      <rect width="246" height="78" rx="12" fill="#FFF7ED" stroke="#FDBA74"/><text x="123" y="25" text-anchor="middle" class="label">local isolation</text><text x="123" y="48" text-anchor="middle" class="eq">aᶦˢᵒᵢ = 1 − cos(vᵢ, mean N(i))</text><text x="123" y="67" text-anchor="middle" class="small">frame vs. bounded neighborhood</text>
      <path class="arrow" d="M123 84V111"/>
      <g transform="translate(0,119)"><rect width="246" height="78" rx="12" fill="#FFFBEB" stroke="#FCD34D"/><text x="123" y="25" text-anchor="middle" class="label">neighborhood persistence</text><text x="123" y="48" text-anchor="middle" class="eq">aᵖᵉʳᵢ = smooth(aᶦˢᵒ, N(i))</text><text x="123" y="67" text-anchor="middle" class="small">distinguishes glitch from short event</text></g>
      <g transform="translate(0,222)"><rect width="246" height="44" rx="12" fill="#F97316"/><text x="123" y="27" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="white">aᵢ = α aᶦˢᵒᵢ + (1−α) aᵖᵉʳᵢ</text></g>
    </g>
  </g>

  <!-- Ranking -->
  <g transform="translate(1115,380)">
    <rect class="card" width="240" height="315"/>
    <circle cx="31" cy="34" r="17" fill="#FCE7F3"/><text x="31" y="40" text-anchor="middle" class="label" fill="#BE185D">4</text>
    <text x="62" y="40" class="h">Utility → MMR</text>
    <g transform="translate(18,72)">
      <rect width="204" height="72" class="soft"/><text x="102" y="28" text-anchor="middle" class="eq">uᵢ = wᵣrᵢ + wq qᵢ − wa aᵢ</text><text x="102" y="52" text-anchor="middle" class="small">relevance · quality · anomaly</text>
      <text x="102" y="100" text-anchor="middle" class="label">diversity-aware selection</text>
      <g transform="translate(0,116)"><rect width="204" height="85" rx="12" fill="#F5F3FF" stroke="#C4B5FD"/><text x="102" y="28" text-anchor="middle" class="eq">argmaxᵢ λuᵢ −</text><text x="102" y="51" text-anchor="middle" class="eq">(1−λ) maxⱼ∈S cos(vᵢ,vⱼ)</text><text x="102" y="73" text-anchor="middle" class="small">maximal marginal relevance</text></g>
      <g transform="translate(3,226)"><rect width="54" height="38" rx="8" fill="#0284C7"/><text x="27" y="24" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="700" fill="white">t₁</text><rect x="72" width="54" height="38" rx="8" fill="#7C3AED"/><text x="99" y="24" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="700" fill="white">t₄</text><rect x="144" width="54" height="38" rx="8" fill="#16A34A"/><text x="171" y="24" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="700" fill="white">t₆</text></g>
    </g>
  </g>

  <path class="arrow" d="M375 538H410"/><path class="arrow" d="M745 538H780"/><path class="arrow" d="M1075 538H1110"/>
  <g transform="translate(210,742)"><rect width="980" height="48" rx="16" fill="url(#blue)"/><text x="490" y="22" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" fill="white">Compact Top-K evidence set for downstream VLM reasoning</text><text x="490" y="39" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#DBEAFE">relevant · legible · non-redundant · temporally informative</text></g>
  <path class="arrow" d="M1235 700C1235 730 1190 756 1190 756"/>
  <text x="1350" y="818" text-anchor="end" class="small">Public schematic — weights and inputs are intentionally configurable</text>
</svg>
